<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFT Preview Card Component</title>

    <link rel="icon" href="./images/favicon-32x32.png" type="image/png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="main-container">
      <img
        src="./images/image-equilibrium.jpg"
        alt="illustration for equillibrium"
        class="illustration"
      />

      <!-- main -->
      <main>
        <h1 class="text-heading">equillibrium #3429</h1>
        <p class="description">
          Our Equillibrium collection promotes balance and calm.
        </p>
        <div class="stats stats-eth">
          <img src="./images/icon-ethereum.svg" alt="icon-ethereum" />
          <p>0.041ETH</p>
        </div>
        <div class="stats stats-time">
          <img src="./images/icon-clock.svg" alt="icon-clock" />
          <p>3 days left</p>
        </div>
      </main>

      <!-- footer -->
      <footer>
        <img src="./images/image-avatar.png" alt="jules wyvern" />
        <p>Creation of <span class="highlight">jules wyvern</span></p>
      </footer>
    </section>
  </body>
</html>
