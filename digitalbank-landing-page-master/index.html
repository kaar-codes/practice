<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div id="root">
      <!-- NAVIGATION TOP SECTION -->
      <nav class="flex-center-between">
        <a href="#">
          <img
            src="./images/logo-dark.svg"
            alt="logo digital bank"
            class="logo"
          />
        </a>
        <ul class="navigation flex-center-between">
          <li class="nav-menu" id="nav_menu_home">Home</li>
          <li class="nav-menu" id="nav_menu_about">About</li>
          <li class="nav-menu" id="nav_menu_contact">Contact</li>
          <li class="nav-menu" id="nav_menu_blog">Blog</li>
          <li class="nav-menu" id="nav_menu_careers">Careers</li>
        </ul>
        <button class="cta" id="request_demo">Request Invite</button>
      </nav>

      <!-- HERO SECTION -->
      <section id="hero_section" class="flex-center-between">
        <div class="hero-content">
          <h1 class="base-heading">Next generation digital banking</h1>
          <p class="content">
            Take your financial life online. Your Digitalbank account will be a
            one-stop-shop for spending, saving, budgeting, investing, and much
            more.
          </p>
          <button class="cta" id="request_demo">Request Invite</button>
        </div>

        <img
          src="./images/image-mockups.png"
          alt="Four different screens of the banking app"
          class="intro-mockup"
        />
      </section>
    </div>
  </body>
</html>
